<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warehouse Dark Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* ҚАРАҢҒЫ ТЕМА ТҮСТЕРІ */
            --bg: #111827;           /* Өте қою сұр (Фон) */
            --card-bg: #1f2937;      /* Сәл ашық сұр (Карточка) */
            --text-main: #f9fafb;    /* Ақ (Негізгі мәтін) */
            --text-light: #9ca3af;   /* Сұр (Көмекші мәтін) */
            --input-bg: #374151;     /* Инпуттың фоны */
            --border: #4b5563;       /* Жиектер */

            --primary: #6366f1;      /* Көк-күлгін (Батырма) */
            --primary-hover: #4f46e5;
            --danger: #ef4444;       /* Қызыл */
            --danger-hover: #dc2626;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 40px 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        p.subtitle { color: var(--text-light); margin-top: 5px; }

        /* CARDS (Карточкалар) */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5); /* Қою көлеңке */
            padding: 25px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        /* FORM INPUTS */
        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr auto;
            gap: 15px;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            background-color: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            color: white; /* Жазу ақ болу керек */
            outline: none;
            box-sizing: border-box;
        }
        input::placeholder { color: #9ca3af; }
        input:focus {
            border-color: var(--primary);
            background-color: #4b5563;
        }

        /* BUTTONS */
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
        }

        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-2px); }

        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .btn-refresh { background-color: #10b981; }
        .btn-refresh:hover { background-color: #059669; }

        .btn-icon {
            padding: 8px;
            border-radius: 8px;
            background: #374151; /* Dark icon bg */
            color: #fca5a5;
        }
        .btn-icon:hover { background: var(--danger); color: white; }

        /* ACTIONS BAR */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        /* TABLE (Кесте) */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
        }
        th {
            background-color: #111827; /* Header darker */
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 15px;
            border-bottom: 1px solid var(--border);
            color: var(--text-main);
        }
        tr:hover { background-color: #374151; }

        .price-tag {
            font-weight: 700;
            color: #818cf8;
            background: #312e81;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .supplier-tag {
            background: #374151;
            padding: 4px 8px;
            border-radius: 4px;
            color: #d1d5db;
            font-size: 0.9rem;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
            .actions-bar { flex-direction: column; gap: 10px; align-items: stretch; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1><span>📦</span> Warehouse System</h1>
        <p class="subtitle">Dark Mode Dashboard</p>
    </header>

    <div class="card">
        <h3 style="margin-top: 0; margin-bottom: 15px;">New Item</h3>
        <div class="form-grid">
            <input type="text" id="pName" placeholder="Product Name (e.g. RTX 4090)">
            <input type="number" id="pPrice" placeholder="Price">
            <input type="number" id="pSupplier" placeholder="Supplier ID">
            <button class="btn-primary" onclick="addProduct()">
                <span>+</span> Add
            </button>
        </div>
    </div>

    <div class="actions-bar">
        <h3 style="margin: 0;">Inventory List</h3>
        <div style="display: flex; gap: 10px;">
            <button class="btn-refresh" onclick="loadProducts()">🔄 Refresh</button>
            <button class="btn-danger" onclick="deleteAllProducts()">🗑 Delete All</button>
        </div>
    </div>

    <div class="card" style="padding: 0; overflow: hidden;">
        <div class="table-container">
            <table id="productTable">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Product Name</th>
                    <th>Price</th>
                    <th>Supplier</th>
                    <th style="text-align: right;">Action</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = "http://localhost:8080/api/products";

    async function loadProducts() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error("Server Error");
            const products = await response.json();
            const tbody = document.querySelector("#productTable tbody");
            tbody.innerHTML = "";

            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 20px; color: #6b7280;">No items found</td></tr>`;
                return;
            }

            products.forEach(p => {
                const row = `
                        <tr>
                            <td style="color: #6b7280;">#${p.id}</td>
                            <td style="font-weight: 600;">${p.name}</td>
                            <td><span class="price-tag">$${p.price.toFixed(2)}</span></td>
                            <td><span class="supplier-tag">Sup-${p.supplierId || '?'}</span></td>
                            <td style="text-align: right;">
                                <button class="btn-icon" onclick="deleteProduct(${p.id})" title="Delete">
                                    🗑
                                </button>
                            </td>
                        </tr>
                    `;
                tbody.innerHTML += row;
            });
        } catch (error) { console.error("Error:", error); }
    }

    async function addProduct() {
        const name = document.getElementById("pName").value;
        const price = document.getElementById("pPrice").value;
        const supplierId = document.getElementById("pSupplier").value;

        if (!name || !price) return alert("Fill in Name and Price!");

        await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, price: parseFloat(price), supplierId: parseInt(supplierId) || 0 })
        });

        document.getElementById("pName").value = "";
        document.getElementById("pPrice").value = "";
        document.getElementById("pSupplier").value = "";
        loadProducts();
    }

    async function deleteProduct(id) {
        if (!confirm("Delete this item?")) return;
        await fetch(API_URL + "?id=" + id, { method: "DELETE" });
        loadProducts();
    }

    async function deleteAllProducts() {
        if (!confirm("⚠️ Delete EVERYTHING?")) return;
        await fetch(API_URL + "?all=true", { method: "DELETE" });
        loadProducts();
    }

    loadProducts();
</script>
</body>
</html>
